services:
  - type: web
    name: starlink-giveaway-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true          # Render generates a random secret automatically
      - key: ADMIN_EMAIL
        value: admin@spotnet.co.il
      - key: ADMIN_PASSWORD
        sync: false
      # Textbelt SMS API key – set this in Render dashboard (keep secret!)
      # - key: TEXTBELT_API_KEY
      #   value: your_key_here
      # Set FRONTEND_URL to your Netlify/Render frontend URL after deploy
      # - key: FRONTEND_URL
      #   value: https://your-app.netlify.app
      # Optional: point to a Render Disk for persistent SQLite
      # - key: DB_PATH
      #   value: /data/raffle.db
